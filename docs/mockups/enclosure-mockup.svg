<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .label { font: 600 20px Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 16px Arial, sans-serif; fill: #374151; }
      .callout { stroke: #374151; stroke-width: 2; fill: none; }
      .body { fill: #1f2937; stroke: #111827; stroke-width: 3; }
      .accent { fill: #374151; stroke: #111827; stroke-width: 2; }
      .window { fill: #0ea5e9; opacity: 0.35; stroke: #0c4a6e; stroke-width: 2; }
      .battery { fill: #6b7280; stroke: #111827; stroke-width: 2; }
      .ui { fill: #f9fafb; stroke: #d1d5db; stroke-width: 2; rx: 16; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff" />
  <text x="56" y="64" class="title">Portable Hybrid 3D Scanner - Enclosure Mockup (Concept)</text>

  <!-- Main handheld body -->
  <path class="body" d="M330 160 L610 135 Q660 130 705 160 L795 220 Q830 243 835 283 L835 378 Q836 410 810 432 L725 503 Q688 535 634 540 L503 553 Q459 559 427 535 L344 469 Q318 447 317 416 L315 210 Q315 182 330 160 Z" />

  <!-- Grip -->
  <path class="accent" d="M470 360 L585 350 Q624 346 649 371 L695 417 Q720 441 718 475 L705 624 Q701 664 664 677 L622 692 Q585 704 563 674 L495 578 Q471 543 468 498 L463 393 Q461 372 470 360 Z" />

  <!-- Sensor window -->
  <rect x="706" y="238" width="99" height="76" rx="10" class="window" />
  <circle cx="732" cy="277" r="12" fill="#0c4a6e" />
  <circle cx="780" cy="277" r="12" fill="#0c4a6e" />

  <!-- RGB lens -->
  <circle cx="680" cy="276" r="22" fill="#111827" stroke="#60a5fa" stroke-width="3" />

  <!-- LED ring area -->
  <circle cx="620" cy="262" r="42" fill="none" stroke="#f59e0b" stroke-width="8" opacity="0.7" />

  <!-- Fan vent -->
  <rect x="366" y="238" width="82" height="98" rx="8" class="accent" />
  <line x1="377" y1="252" x2="438" y2="252" class="callout" />
  <line x1="377" y1="270" x2="438" y2="270" class="callout" />
  <line x1="377" y1="288" x2="438" y2="288" class="callout" />
  <line x1="377" y1="306" x2="438" y2="306" class="callout" />
  <line x1="377" y1="324" x2="438" y2="324" class="callout" />

  <!-- Battery bay -->
  <rect x="337" y="390" width="154" height="66" rx="10" class="battery" />
  <rect x="344" y="399" width="116" height="48" rx="6" fill="#9ca3af" />
  <text x="350" y="430" class="small">USB-C PD battery bay</text>

  <!-- Top status LEDs -->
  <circle cx="533" cy="149" r="6" fill="#22c55e" />
  <circle cx="553" cy="149" r="6" fill="#f59e0b" />
  <circle cx="573" cy="149" r="6" fill="#ef4444" />

  <!-- Tripod thread -->
  <circle cx="594" cy="536" r="8" fill="#d1d5db" stroke="#111827" stroke-width="2" />
  <text x="610" y="543" class="small">1/4-20 tripod insert</text>

  <!-- iPhone control panel -->
  <rect x="900" y="175" width="250" height="510" class="ui" />
  <rect x="928" y="223" width="194" height="122" rx="10" fill="#111827" />
  <text x="936" y="294" fill="#f8fafc" class="small">Live depth preview</text>
  <rect x="928" y="364" width="194" height="58" rx="10" fill="#10b981" />
  <text x="988" y="400" fill="#f8fafc" class="label">Start Scan</text>
  <rect x="928" y="435" width="92" height="48" rx="8" fill="#e5e7eb" />
  <rect x="1030" y="435" width="92" height="48" rx="8" fill="#e5e7eb" />
  <text x="948" y="466" class="small">Handheld</text>
  <text x="1048" y="466" class="small">Turntable</text>
  <rect x="928" y="500" width="194" height="120" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5" />
  <text x="939" y="529" class="small">Object-only mask: ON</text>
  <text x="939" y="554" class="small">Plane removal: ON</text>
  <text x="939" y="579" class="small">Largest cluster: ON</text>

  <!-- Callouts -->
  <line x1="810" y1="266" x2="892" y2="236" class="callout" />
  <text x="895" y="234" class="label">Depth + RGB sensor window</text>

  <line x1="620" y1="218" x2="862" y2="128" class="callout" />
  <text x="867" y="126" class="label">LED fill ring (diffused)</text>

  <line x1="448" y1="286" x2="225" y2="236" class="callout" />
  <text x="72" y="232" class="label">Active cooling vent</text>

  <line x1="404" y1="423" x2="163" y2="469" class="callout" />
  <text x="52" y="470" class="label">Replaceable battery module</text>

  <line x1="640" y1="641" x2="852" y2="668" class="callout" />
  <text x="858" y="674" class="label">Ergonomic grip with inserts</text>
</svg>

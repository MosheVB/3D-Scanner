<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .label { font: 600 20px Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 16px Arial, sans-serif; fill: #374151; }
      .callout { stroke: #374151; stroke-width: 2; fill: none; }
      .deck { fill: #111827; stroke: #030712; stroke-width: 3; }
      .base { fill: #374151; stroke: #111827; stroke-width: 3; }
      .motor { fill: #6b7280; stroke: #1f2937; stroke-width: 2; }
      .rail { fill: #4b5563; stroke: #111827; stroke-width: 2; }
      .scanner { fill: #1f2937; stroke: #111827; stroke-width: 2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff" />
  <text x="56" y="64" class="title">Portable 3D Scanner - Rotary Table Dock Mockup (Concept)</text>

  <!-- Table deck -->
  <ellipse cx="420" cy="280" rx="220" ry="70" class="deck" />
  <ellipse cx="420" cy="296" rx="220" ry="70" fill="#1f2937" stroke="#111827" stroke-width="2" />

  <!-- Object on table -->
  <path d="M408 210 L445 216 L458 244 L455 283 L438 307 L414 306 L393 287 L387 251 Z" fill="#d4d4d8" stroke="#4b5563" stroke-width="2" />
  <circle cx="427" cy="199" r="24" fill="#e5e7eb" stroke="#6b7280" stroke-width="2" />
  <text x="366" y="342" class="small">Object at center of rotation</text>

  <!-- Base -->
  <rect x="178" y="296" width="484" height="174" rx="24" class="base" />
  <rect x="206" y="330" width="204" height="110" rx="12" fill="#4b5563" stroke="#111827" stroke-width="2" />
  <text x="220" y="391" class="small" fill="#f3f4f6">NEMA17 + GT2 belt space</text>

  <!-- Motor driver bay -->
  <rect x="435" y="330" width="200" height="110" rx="12" fill="#4b5563" stroke="#111827" stroke-width="2" />
  <text x="447" y="380" class="small" fill="#f3f4f6">Arduino + driver bay</text>
  <text x="462" y="405" class="small" fill="#f3f4f6">(USB serial control)</text>

  <!-- Feet -->
  <ellipse cx="224" cy="480" rx="23" ry="11" fill="#111827" />
  <ellipse cx="612" cy="480" rx="23" ry="11" fill="#111827" />

  <!-- Scanner cradle + rail -->
  <rect x="725" y="340" width="325" height="36" rx="14" class="rail" />
  <rect x="948" y="230" width="94" height="144" rx="14" class="scanner" />
  <rect x="960" y="249" width="72" height="52" rx="8" fill="#0ea5e9" opacity="0.35" stroke="#0c4a6e" stroke-width="2" />
  <path d="M888 313 L1012 313 L1026 341 L879 341 Z" fill="#6b7280" stroke="#1f2937" stroke-width="2" />

  <!-- Angle marker -->
  <path d="M834 325 A112 112 0 0 0 913 232" fill="none" stroke="#10b981" stroke-width="5" />
  <polygon points="913,232 904,235 910,244" fill="#10b981" />
  <text x="774" y="234" class="small">Fixed camera angle (30 to 40 deg)</text>

  <!-- Wiring channel -->
  <path d="M633 376 C700 402 737 438 770 500" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 7" />
  <text x="774" y="520" class="small">Cable channel + strain relief</text>

  <!-- Callouts -->
  <line x1="420" y1="228" x2="165" y2="142" class="callout" />
  <text x="48" y="138" class="label">Textured non-slip top plate</text>

  <line x1="287" y1="383" x2="76" y2="358" class="callout" />
  <text x="30" y="355" class="label">Stepper compartment</text>

  <line x1="536" y1="363" x2="779" y2="116" class="callout" />
  <text x="785" y="112" class="label">Motor control electronics bay</text>

  <line x1="966" y1="275" x2="1113" y2="198" class="callout" />
  <text x="1118" y="201" class="label">Scanner dock cradle</text>

  <line x1="768" y1="356" x2="1089" y2="393" class="callout" />
  <text x="1094" y="397" class="label">Linear rail for repeatable pose</text>

  <text x="54" y="700" class="small">Concept intent: detachable portable scanner docks for precise, object-only tabletop scans.</text>
</svg>
